<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ARCA research workflow</title>
  <desc id="desc">Connect and set up, initialize the project, work with evidence, then checkpoint and resume.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f48"/>
      <stop offset="1" stop-color="#0b3038"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#062229" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>

  <g transform="translate(58 52)">
    <rect width="64" height="64" rx="14" fill="none" stroke="#7ce8d6" stroke-width="2"/>
    <path d="M18 44 30 18h7l10 26h-7l-2.3-6.7H27.8L25 44Zm12-12.7h6L33.2 23Z" fill="#c3fff3"/>
    <path d="M49 15h3L45 49h-3Z" fill="#58d6c2"/>
    <text x="84" y="31" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="5">ARCA</text>
    <text x="85" y="54" fill="#91ded2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2.8">AGENTIC RESEARCH CONTEXT ARCHITECTURE</text>
  </g>

  <line x1="58" y1="140" x2="1142" y2="140" stroke="#4e7d83" stroke-width="1"/>
  <text x="58" y="180" fill="#79dacb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2.3">A RESTARTABLE RESEARCH WORKFLOW</text>
  <text x="58" y="222" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">Talk to your coding agent. Keep the evidence in the repository.</text>
  <text x="58" y="251" fill="#c7dfe2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">ARCA preserves goals, experiments, decisions, negative results, and paper claims across sessions and models.</text>

  <g transform="translate(58 286)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <g>
      <rect width="247" height="82" rx="14" fill="#234f58" stroke="#58828a"/>
      <text x="18" y="27" fill="#7ce8d6" font-size="12" font-weight="800">01</text>
      <text x="18" y="57" fill="#ffffff" font-size="17" font-weight="650">Connect &amp; set up</text>
    </g>
    <path d="M257 41h18m-7-7 7 7-7 7" fill="none" stroke="#70cfc1" stroke-width="2"/>
    <g transform="translate(285)">
      <rect width="247" height="82" rx="14" fill="#234f58" stroke="#58828a"/>
      <text x="18" y="27" fill="#7ce8d6" font-size="12" font-weight="800">02</text>
      <text x="18" y="57" fill="#ffffff" font-size="17" font-weight="650">Initialize the project</text>
    </g>
    <path d="M542 41h18m-7-7 7 7-7 7" fill="none" stroke="#70cfc1" stroke-width="2"/>
    <g transform="translate(570)">
      <rect width="247" height="82" rx="14" fill="#234f58" stroke="#58828a"/>
      <text x="18" y="27" fill="#7ce8d6" font-size="12" font-weight="800">03</text>
      <text x="18" y="57" fill="#ffffff" font-size="17" font-weight="650">Work with evidence</text>
    </g>
    <path d="M827 41h18m-7-7 7 7-7 7" fill="none" stroke="#70cfc1" stroke-width="2"/>
    <g transform="translate(855)">
      <rect width="247" height="82" rx="14" fill="#234f58" stroke="#58828a"/>
      <text x="18" y="27" fill="#7ce8d6" font-size="12" font-weight="800">04</text>
      <text x="18" y="57" fill="#ffffff" font-size="17" font-weight="650">Checkpoint &amp; resume</text>
    </g>
  </g>
</svg>
