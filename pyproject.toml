[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arca-research-cli"
version = "0.1.0"
description = "A shared local interface for Agentic Research Context Architecture"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
arca = "arca_cli.cli:main"

[tool.setuptools]
packages = ["arca_cli"]
