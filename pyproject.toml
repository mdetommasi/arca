[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arca-research-cli"
version = "0.1.0"
description = "A shared local interface for Agentic Research Context Architecture"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
arca = "arca_cli.cli:main"

[tool.hatch.build]
directory = ".local/dist"

[tool.hatch.build.targets.wheel]
packages = ["scripts/arca_cli"]

[tool.hatch.build.targets.sdist]
only-include = ["scripts/arca_cli", "pyproject.toml", "README.md"]
